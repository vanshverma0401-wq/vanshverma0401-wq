<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Oracle SQL demonstration schema</title><desc id="desc">Conceptual five-table fictional demonstration: positions and teams connect to players; players and games connect to player stats. Games also has home-team and away-team foreign keys to teams. Real Oracle execution remains unverified.</desc><rect width="900" height="560" rx="20" fill="#11191b"/><text x="40" y="51" fill="#94dcb6" font-family="Consolas,monospace" font-size="17" letter-spacing="2">DATABASE DESIGN / CONCEPTUAL VIEW</text><text x="40" y="102" fill="#eef4ef" font-family="Trebuchet MS,sans-serif" font-size="36" font-weight="700">Structure before queries.</text><g fill="none" stroke="#6f9d89" stroke-width="2"><path d="M280 201H355V291H410"/><path d="M280 381H355V315H410"/><path d="M280 420H325V453H645V398H660"/><path d="M590 301H625V217H660"/><path d="M750 282V332"/></g><g font-family="Consolas,monospace"><rect x="40" y="154" width="240" height="94" rx="12" fill="#21352c" stroke="#4c725b"/><text x="61" y="190" fill="#d7eee0" font-size="22">positions</text><text x="61" y="220" fill="#9fb6aa" font-size="15">PK position_id</text><rect x="40" y="334" width="240" height="94" rx="12" fill="#21352c" stroke="#4c725b"/><text x="61" y="370" fill="#d7eee0" font-size="22">teams</text><text x="61" y="400" fill="#9fb6aa" font-size="15">PK team_id</text><rect x="410" y="253" width="180" height="94" rx="12" fill="#23383e" stroke="#55777e"/><text x="431" y="289" fill="#d6e8ed" font-size="22">players</text><text x="431" y="319" fill="#a4b9c0" font-size="15">PK player_id</text><rect x="660" y="176" width="200" height="106" rx="12" fill="#21352c" stroke="#4c725b"/><text x="681" y="212" fill="#d7eee0" font-size="22">player_stats</text><text x="681" y="242" fill="#9fb6aa" font-size="15">FK player_id</text><text x="681" y="264" fill="#9fb6aa" font-size="15">FK game_id</text><rect x="660" y="332" width="200" height="94" rx="12" fill="#21352c" stroke="#4c725b"/><text x="681" y="368" fill="#d7eee0" font-size="22">games</text><text x="681" y="398" fill="#9fb6aa" font-size="15">home / away team FK</text></g><text x="40" y="500" fill="#bdc9c3" font-family="Trebuchet MS,sans-serif" font-size="18">Keys · Constraints · Joins · Views · Analytical ranking</text><text x="40" y="531" fill="#8c9d94" font-family="Trebuchet MS,sans-serif" font-size="15">Fictional-data demonstration, separate from original coursework. Oracle runtime unverified.</text></svg>
