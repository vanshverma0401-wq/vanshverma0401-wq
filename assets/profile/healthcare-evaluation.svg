<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc"><title id="title">Synthetic healthcare billing benchmark — honest evaluation</title><desc id="desc">A separate November 10, 2026 benchmark used 10,000 synthetic rows and disjoint normalized-name proxy groups. Fixed logistic test ROC-AUC was 0.485 against a prior baseline of 0.500. Weak signal, not clinical usefulness.</desc><rect width="900" height="560" rx="20" fill="#11191b"/><text x="40" y="51" fill="#94dcb6" font-family="Consolas,monospace" font-size="17" letter-spacing="2">APPLIED ML / EVALUATION FIRST</text><text x="40" y="102" fill="#eef4ef" font-family="Trebuchet MS,sans-serif" font-size="36" font-weight="700">Trust the split. Report the result.</text><text x="40" y="151" fill="#a8bab0" font-family="Trebuchet MS,sans-serif" font-size="21">10,000 synthetic records · fixed models · held-out test</text><rect x="40" y="191" width="395" height="180" rx="15" fill="#21352c" stroke="#41624e"/><rect x="465" y="191" width="395" height="180" rx="15" fill="#1c2a30" stroke="#3d5661"/><g font-family="Consolas,monospace" font-size="16"><text x="66" y="230" fill="#b1c7b8">LOGISTIC / TEST ROC-AUC</text><text x="491" y="230" fill="#b0c1ca">PRIOR / TEST ROC-AUC</text></g><g font-family="Trebuchet MS,sans-serif"><text x="63" y="311" fill="#c9edda" font-size="73" font-weight="700">0.485</text><text x="488" y="311" fill="#cadfe9" font-size="73" font-weight="700">0.500</text><text x="66" y="345" fill="#9db4a5" font-size="17">Weak signal — no success claim</text><text x="491" y="345" fill="#9db1bc" font-size="17">Baseline for comparison</text><text x="40" y="453" fill="#bdc9c3" font-size="19">Train-only preprocessing + target cutoff. Group-disjoint partitions.</text><text x="40" y="495" fill="#91a199" font-size="16">November 2026 extension to collaborative synthetic-data coursework.</text><text x="40" y="526" fill="#91a199" font-size="16">Name groups are identity proxies. No clinical validation or deployment claimed.</text></g><path d="M40 414H860" stroke="#2b4036"/></svg>
