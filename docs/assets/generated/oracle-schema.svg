<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Conceptual Oracle basketball demonstration schema</title><desc id="desc">Five tables: positions and teams relate to players; players and games relate to player_stats; games also refer to home and away teams. Conceptual diagram, not Oracle runtime proof.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#142024" stroke="none"/><text x="56" y="56" fill="#a6e8bd" font-size="17" font-weight="700">ORACLE SQL / RELATIONAL MODELING</text><text x="56" y="118" fill="#eaf0ec" font-size="46" font-weight="700">Make relationships explicit.</text><path d="M306 251 L424 251" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M306 462 L365 462" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M365 462 L365 312" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M365 312 L424 312" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M680 251 L798 251" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M930 414 L930 328" fill="none" stroke="#7cb59c" stroke-width="3"/><path d="M306 500 L798 500" fill="none" stroke="#7cb59c" stroke-width="3"/><rect x="56" y="195" width="250" height="150" rx="14" fill="#1c2b30" stroke="#3a5158"/><rect x="56" y="195" width="250" height="47" rx="14" fill="#293e44" stroke="none"/><text x="74" y="226" fill="#b2eac6" font-size="23" font-weight="700">positions</text><text x="74" y="273" fill="#d3dfdb" font-size="17" font-weight="400">PK position_id</text><text x="74" y="300" fill="#d3dfdb" font-size="17" font-weight="400">position_code</text><text x="74" y="327" fill="#d3dfdb" font-size="17" font-weight="400">position_name</text><rect x="56" y="414" width="250" height="150" rx="14" fill="#1c2b30" stroke="#3a5158"/><rect x="56" y="414" width="250" height="47" rx="14" fill="#293e44" stroke="none"/><text x="74" y="445" fill="#b2eac6" font-size="23" font-weight="700">teams</text><text x="74" y="492" fill="#d3dfdb" font-size="17" font-weight="400">PK team_id</text><text x="74" y="519" fill="#d3dfdb" font-size="17" font-weight="400">team_name</text><text x="74" y="546" fill="#d3dfdb" font-size="17" font-weight="400">home_city</text><rect x="424" y="195" width="256" height="150" rx="14" fill="#1c2b30" stroke="#3a5158"/><rect x="424" y="195" width="256" height="47" rx="14" fill="#293e44" stroke="none"/><text x="442" y="226" fill="#b2eac6" font-size="23" font-weight="700">players</text><text x="442" y="273" fill="#d3dfdb" font-size="17" font-weight="400">PK player_id</text><text x="442" y="300" fill="#d3dfdb" font-size="17" font-weight="400">FK position_id</text><text x="442" y="327" fill="#d3dfdb" font-size="17" font-weight="400">FK team_id</text><rect x="798" y="178" width="346" height="150" rx="14" fill="#1c2b30" stroke="#3a5158"/><rect x="798" y="178" width="346" height="47" rx="14" fill="#293e44" stroke="none"/><text x="816" y="209" fill="#b2eac6" font-size="23" font-weight="700">player_stats</text><text x="816" y="256" fill="#d3dfdb" font-size="17" font-weight="400">PK stat_id</text><text x="816" y="283" fill="#d3dfdb" font-size="17" font-weight="400">FK player_id · FK game_id</text><text x="816" y="310" fill="#d3dfdb" font-size="17" font-weight="400">points · rebounds · assists</text><rect x="798" y="414" width="346" height="150" rx="14" fill="#1c2b30" stroke="#3a5158"/><rect x="798" y="414" width="346" height="47" rx="14" fill="#293e44" stroke="none"/><text x="816" y="445" fill="#b2eac6" font-size="23" font-weight="700">games</text><text x="816" y="492" fill="#d3dfdb" font-size="17" font-weight="400">PK game_id</text><text x="816" y="519" fill="#d3dfdb" font-size="17" font-weight="400">FK home_team_id</text><text x="816" y="546" fill="#d3dfdb" font-size="17" font-weight="400">FK away_team_id</text><text x="354" y="531" fill="#a7b7b6" font-size="17" font-weight="400">home / away</text><text x="56" y="632" fill="#a7b7b6" font-size="19" font-weight="400">Conceptual view of the fictional five-table demonstration, separate from original DDL.</text><text x="56" y="671" fill="#a7b7b6" font-size="19" font-weight="400">Keys · constraints · joins · views · analytical SQL. Oracle runtime execution unverified.</text></g></svg>
