<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Historical Zillow benchmark: fixed Ridge versus persistence</title><desc id="desc">Actual aggregate MAE values from the separate 50-metro historical benchmark; not the original neighborhood XGBoost model.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#142024" stroke="none"/><text x="56" y="56" fill="#a6e8bd" font-size="17" font-weight="700">ZILLOW / POST-SUBMISSION BENCHMARK</text><text x="56" y="125" fill="#eaf0ec" font-size="42" font-weight="700">Test the forecast against a baseline.</text><text x="56" y="166" fill="#a7b7b6" font-size="21" font-weight="400">Mean absolute error · lower is better · source-currency units</text><text x="56" y="278" fill="#eaf0ec" font-size="26" font-weight="600">Unchanged-value baseline</text><rect x="56" y="300" width="750" height="40" rx="5" fill="#24343a" stroke="none"/><rect x="56" y="300" width="621.2379113577082" height="40" rx="5" fill="#68808b" stroke="none"/><text x="56" y="380" fill="#eaf0ec" font-size="31" font-weight="700">24,850</text><text x="56" y="438" fill="#eaf0ec" font-size="26" font-weight="600">Fixed Ridge</text><rect x="56" y="460" width="750" height="40" rx="5" fill="#24343a" stroke="none"/><rect x="56" y="460" width="333.931488497863" height="40" rx="5" fill="#b2eac6" stroke="none"/><text x="56" y="540" fill="#eaf0ec" font-size="31" font-weight="700">13,357</text><rect x="880" y="244" width="264" height="316" rx="18" fill="#1c2b30" stroke="#3a5158"/><text x="910" y="305" fill="#b2eac6" font-size="74" font-weight="700">24</text><text x="910" y="343" fill="#eaf0ec" font-size="21" font-weight="400">calendar months</text><text x="910" y="406" fill="#eaf0ec" font-size="21" font-weight="400">50 selected metros</text><text x="910" y="446" fill="#eaf0ec" font-size="21" font-weight="400">1,348 test rows</text><text x="910" y="505" fill="#a6b8b9" font-size="20" font-weight="400">Purged time split</text><text x="56" y="636" fill="#a7b7b6" font-size="19" font-weight="400">Separate bounded benchmark; revised historical data, overlapping test horizons.</text><text x="56" y="671" fill="#a7b7b6" font-size="19" font-weight="400">Data Provided by Zillow Group. No investment or prospective-performance claim.</text></g></svg>
