<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Healthcare billing: near-chance ROC-AUC and group-disjoint splits</title><desc id="desc">New bounded synthetic-data evaluation: 10000 rows, training 6972, validation 1507, test 1521; logistic ROC-AUC 0.485, class-prior baseline 0.5.</desc><g font-family="Arial, sans-serif"><rect x="0" y="0" width="1200" height="720" rx="0" fill="#142024" stroke="none"/><text x="56" y="56" fill="#a6e8bd" font-size="17" font-weight="700">HEALTHCARE / SYNTHETIC EVALUATION</text><text x="56" y="125" fill="#eaf0ec" font-size="42" font-weight="700">A stronger evaluation. An honest result.</text><text x="56" y="263" fill="#b2eac6" font-size="108" font-weight="700">0.485</text><text x="60" y="310" fill="#eaf0ec" font-size="25" font-weight="400">test ROC-AUC</text><text x="60" y="363" fill="#a7b7b6" font-size="26" font-weight="400">Near-chance discrimination.</text><text x="60" y="406" fill="#a7b7b6" font-size="23" font-weight="400">Class-prior baseline: 0.500</text><rect x="640" y="215" width="504" height="225" rx="18" fill="#1c2b30" stroke="#3a5158"/><text x="672" y="270" fill="#eaf0ec" font-size="52" font-weight="700">10,000</text><text x="672" y="308" fill="#eaf0ec" font-size="22" font-weight="400">retained synthetic rows</text><text x="672" y="361" fill="#a6e8bd" font-size="21" font-weight="400">Train-only preprocessing + cutoff</text><text x="672" y="402" fill="#a7b7b6" font-size="20" font-weight="400">Disjoint normalized-name proxy groups</text><text x="56" y="495" fill="#a6e8bd" font-size="17" font-weight="700">GROUP-DISJOINT PARTITIONS</text><rect x="56" y="521" width="754.554" height="32" rx="3" fill="#8dcba6" stroke="none"/><rect x="814.554" y="521" width="159.962" height="32" rx="3" fill="#7b9fb4" stroke="none"/><rect x="978.515" y="521" width="161.485" height="32" rx="3" fill="#bda5c9" stroke="none"/><text x="56" y="591" fill="#eaf0ec" font-size="22" font-weight="400">Train 6,972 · Validation 1,507 · Test 1,521</text><text x="56" y="643" fill="#a7b7b6" font-size="19" font-weight="400">Name grouping is a proxy, not a verified patient identifier.</text><text x="56" y="675" fill="#a7b7b6" font-size="19" font-weight="400">Educational synthetic-data analysis. Clinical utility is not established.</text></g></svg>
